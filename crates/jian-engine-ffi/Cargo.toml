[package]
name         = "jian-engine-ffi"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
description  = "Stable C ABI for embedding the Jian engine"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
metal = ["jian-skia/metal"]
gl          = ["jian-skia/gl"]
# Debug fault seams (M4 plan Task 3 Step 1b); only meaningful with
# debug_assertions — the seams themselves are cfg-gated on both.
debug-hooks = []
textlayout = ["jian-skia/textlayout"]

[dependencies]
jian-core = { path = "../jian-core" }
jian-skia = { path = "../jian-skia" }
async-trait = "0.1"
futures = "0.3"
serde_json = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
