language = "C"
include_guard = "JIAN_H"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen 0.29.4. Regenerate; do not edit this file directly. */"
header = """
/*
 * Jian Engine C ABI
 *
 * This header has one ABI shape in every build. Rust feature flags and debug
 * assertions never add, remove, or alter declarations in this contract.
 *
 * Coordinates: pointer input and all text-geometry inputs/outputs use
 * surface-logical pixels with a top-left origin.
 *
 * Tail-growth versioning: JianCreateDesc.size must be at least
 * offsetof(JianCreateDesc, dpr) + sizeof(float) (36 bytes on the supported
 * 64-bit hosts). JianCallbacks.size must be at least sizeof(size_t) (8 bytes
 * on the supported 64-bit hosts). Missing trailing fields are zero/null; a
 * size larger than the current sizeof(struct) is invalid.
 *
 * Android setComposingText newCursorPosition conversion (UTF-16 units): let S
 * be the replacement/composing start, L the UTF-16 length of the new text,
 * and N Android's newCursorPosition. The absolute cursor is
 * N > 0 ? S + L + N - 1 : S + N, clamped to the final text bounds. For
 * jian_ime_set_composing_text, pass the in-composition cursor relative to S
 * as both sel_start and sel_end; if the clamped cursor is outside the new
 * composing range, set the absolute selection with jian_text_set_selection
 * immediately after the composing call. jian_ime_commit accepts N directly.
 */
"""
line_endings = "LF"
line_length = 100
tab_width = 2
documentation = true
documentation_style = "doxy"
documentation_length = "full"
style = "type"
sort_by = "Name"
usize_is_size_t = true

[export]
include = [
  "JianImeControlOp",
  "JianPointerPhase",
  "JianTextGranularity",
]
exclude = [
  "JianTestCallClass",
  "jian_test_app_number",
  "jian_test_font_generation",
  "jian_test_force_panic",
  "jian_test_get_insets",
  "jian_test_node_rect",
  "jian_test_reload",
  "jian_test_suspended_status",
  "jian_test_variant_build_count",
  "jian_test_viewport_number",
]

[fn]
rename_args = "None"
sort_by = "Name"

[struct]
rename_fields = "None"

[enum]
rename_variants = "None"
prefix_with_name = true

[parse]
parse_deps = false
clean = false
